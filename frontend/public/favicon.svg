  <path d="M72 62 C78 59 88 58 96 60" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M72 72 C78 69 88 68 96 70" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- AI Sparkle / Star on Top Right -->
