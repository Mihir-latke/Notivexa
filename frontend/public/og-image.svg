<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E1A" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#31104B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Academic Gradient Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="260" fill="#4F46E5" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="300" fill="#9333EA" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="550" r="220" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />

  <!-- Grid Accent Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Brand Tag -->
  <g transform="translate(100, 80)">
    <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#10B981" />
    <text x="42" y="27" fill="#E0E7FF" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1">AI STUDY PLATFORM</text>
  </g>

  <!-- Notivexa Logo and Title -->
  <g transform="translate(100, 160)">
    <!-- Book Icon Graphic -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#brandGrad)" />
    <text x="18" y="52" font-size="40" fill="#FFFFFF">📖</text>
    <!-- Brand Title -->
    <text x="96" y="54" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">Notivexa</text>
    <text x="360" y="52" fill="#818CF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400">.com</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="300" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" line-height="1.2">
    Turn Your Academic PDFs into
  </text>
  <text x="100" y="360" fill="url(#brandGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800">
    Handwritten Notes, Diagrams &amp; Exam Papers
  </text>

  <!-- Subheadline -->
  <text x="100" y="420" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Instant study notes in 15 realistic handwriting fonts, AI process flowcharts,
  </text>
  <text x="100" y="452" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Bloom's Taxonomy question papers, smart flashcards &amp; spoken audio lectures.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 500)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="12" fill="url(#cardGrad)" stroke="#4F46E5" stroke-width="1" />
    <text x="20" y="30" fill="#C7D2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">✍️ 15 Handwriting Fonts</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="230" height="48" rx="12" fill="url(#cardGrad)" stroke="#4F46E5" stroke-width="1" />
    <text x="255" y="30" fill="#C7D2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">📊 Flowchart Diagrams</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="230" height="48" rx="12" fill="url(#cardGrad)" stroke="#4F46E5" stroke-width="1" />
    <text x="500" y="30" fill="#C7D2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">📝 20M &amp; 60M Exam Papers</text>

    <!-- Pill 4 -->
    <rect x="725" y="0" width="230" height="48" rx="12" fill="url(#cardGrad)" stroke="#4F46E5" stroke-width="1" />
    <text x="745" y="30" fill="#C7D2FE" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🎙️ Spoken Audio Lectures</text>
  </g>

  <!-- Subtle Watermark -->
  <text x="1000" y="590" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="end">
    https://notivexa.com
  </text>
</svg>

