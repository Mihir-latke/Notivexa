  <path d="M32 50 C40 48 50 49 56 52" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 60 C40 58 50 59 56 62" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 70 C40 68 50 69 56 72" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Book Page Lines (Right) -->
